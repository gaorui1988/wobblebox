upstream wobblebox_web {
    server 127.0.0.1:8090 weight=1 max_fails=3 fail_timeout=5s;
}

server {
    listen 80;
    server_name wobblebox.haizhenkeji.cn;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name wobblebox.haizhenkeji.cn;

    ssl_certificate /etc/nginx/ssl/haizhenkeji.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/haizhenkeji.cn.key;

    ssl_session_timeout 5m;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:!aNULL:!eNULL:!SSLv2:!SSLv3';
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy no-referrer;

    access_log /var/log/nginx/wobblebox.haizhenkeji.cn_access.log;
    error_log /var/log/nginx/wobblebox.haizhenkeji.cn_error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    client_max_body_size 10M;

    location / {
        proxy_pass http://wobblebox_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
